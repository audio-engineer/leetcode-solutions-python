[project]
name = "leetcode-solutions-python"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = [
    "basedpyright>=1.38.3",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.5",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812",
    "D101",
    "D102",
    "D103",
    "D104",
    "UP035",
    "UP006",
    "N802",
    "D107",
    "I001",
]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["S101", "FBT001", "PLR2004"]

[tool.ruff.lint.pydocstyle]
convention = "google"
